<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#2ECC71"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <!-- Outer Ripple -->
  <circle cx="128" cy="128" r="90" stroke="url(#greenGrad)" stroke-width="12" fill="none"/>
  <circle cx="128" cy="128" r="65" stroke="url(#greenGrad)" stroke-width="10" fill="none"/>

  <!-- Bottom Arc -->
  <path d="M60 140 A68 68 0 0 0 196 140"
        stroke="url(#amberGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Line Graph -->
  <polyline points="60,140 95,120 120,135 150,105 180,115"
            stroke="url(#greenGrad)" stroke-width="8"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Droplet -->
  <path d="M128 150 C128 130 150 120 128 95 C106 120 128 130 128 150Z"
        fill="url(#greenGrad)"/>
</svg>